services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: flux-wireguard-test
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - SERVERURL=127.0.0.1
      - SERVERPORT=51820
      - PEERS=fluxclient
      - PEERDNS=10.13.13.1
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=10.13.13.0/24
      - LOG_CONFS=false
    volumes:
      - ./config:/config
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped